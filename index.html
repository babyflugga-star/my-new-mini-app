<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flugga Store</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background-color: #1a1a1a; color: white; font-family: sans-serif; padding: 20px; }
        .card { background: #2d2d2d; padding: 20px; border-radius: 12px; margin-bottom: 15px; }
        .btn { background: #7b61ff; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>FLUGGA STORE</h1>
    
    <div class="card">
        <h3>Template для Logic Pro</h3>
        <p>1 990 ₽</p>
        <button class="btn" onclick="buyProduct('Logic Pro')">Выбрать</button>
    </div>

    <div class="card">
        <h3>Template для FL Studio</h3>
        <p>1 990 ₽</p>
        <button class="btn" onclick="buyProduct('FL Studio')">Выбрать</button>
    </div>

    <div class="card">
        <h3>Vocal пресеты (мой рак)</h3>
        <p>2 490 ₽</p>
        <button class="btn" onclick="buyProduct('Vocal Presets')">Выбрать</button>
    </div>

    <script>
        function buyProduct(productName) {
            const user = window.Telegram.WebApp.initDataUnsafe.user;
            if (!user || !user.id) {
                alert("Ошибка: откройте магазин через красную кнопку Telegram.");
                return;
            }

            fetch('/api/order', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    userId: user.id,
                    username: user.username || user.first_name,
                    product: productName
                })
            })
            .then(res => res.json())
            .then(data => {
                alert(data.message);
                window.Telegram.WebApp.close();
            })
            .catch(() => alert('Ошибка при отправке заказа. Проверьте токен.'));
        }
    </script>
</body>
</html>
